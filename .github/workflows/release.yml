name: Release Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  deb:
    uses: ./.github/workflows/build-deb.yml

  win:
    uses: ./.github/workflows/build-win.yml

  publish:
    needs: [deb, win]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cp $(find dist -name '*.deb') "quicknote-${TAG}-linux-amd64.deb"
          cp $(find dist -name '*.exe') "quicknote-${TAG}-win-x64.exe"
          gh release create "${TAG}" \
            "quicknote-${TAG}-linux-amd64.deb" \
            "quicknote-${TAG}-win-x64.exe" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes
